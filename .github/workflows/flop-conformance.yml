name: flop-conformance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'client-conformance/**'
      - 'tools/build-direct-rail-input.py'
      - '.github/workflows/flop-conformance.yml'
jobs:
  direct-rail-f1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v client-conformance/test_task_id_conformance.py
      - run: python tools/build-direct-rail-input.py
      - id: conformance
        uses: retardio73-boop/flop-conformance-lab@4b539a2e3c213ce3588a9e3e3f34095732d77246
        with:
          profile: direct-rail-f1
          input: evidence/flop-direct-rail-f1.json
          out: conformance-report.json

