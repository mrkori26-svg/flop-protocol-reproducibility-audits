name: FLOP Conformance Lab

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-rail-f1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify repository-native F.1 harness
        run: python -m unittest -v client-conformance/test_task_id_conformance.py
      - name: Export existing fixture to portable Lab profile
        run: |
          python client-conformance/export_flop_profile.py \
            --revision "$GITHUB_SHA" \
            --out .flop/direct-rail-f1.json
      - id: flop
        uses: retardio73-boop/flop-conformance-lab@03735253f6e020048a9aa54a94f9fa69e1a685c7
        with:
          profile: direct-rail-f1
          input: .flop/direct-rail-f1.json
          out: flop-conformance-report.json
          artifact-name: osr21-direct-rail-f1
      - name: Require PASS
        run: test "${{ steps.flop.outputs.result }}" = "PASS"
